<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vélo + RER du 31 octobre</title>
<meta name="description" content="Tour à vélo samedi après-midi : RER depuis Montmartre et 3 boucles autour de Paris.">
<meta property="og:title" content="Tour à vélo · samedi après-midi">
<meta property="og:description" content="RER + vélo : Versailles, canal de l’Ourcq ou Vaux de Cernay. Carte, horaires aller et retour.">
<meta property="og:image" content="https://aureliengiraud.github.io/velo-rer/cover.jpg">
<meta property="og:url" content="https://aureliengiraud.github.io/velo-rer/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: white reading column on the left, tilted 2.5D map filling the rest; stacked map-then-column on phones. */
:root {
  --bg: #ffffff;
  --ink: #15171c;
  --muted: #646b78;
  --line: #e6e8ee;
  --soft: #f4f5f8;
  --ok: #0f8a5f; --warn: #b7791f; --late: #c2412d;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

html { scroll-behavior: smooth; }
.cover { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.cover img { display: block; width: 100%; max-width: 1200px; height: auto; max-height: 82vh; object-fit: contain; }
.go { font: 600 15px var(--f-ui); color: var(--bg); background: var(--ink); text-decoration: none; padding: 12px 20px; border-radius: 999px; }
.go::after { content: " ↓"; }
.go:active { transform: scale(.97); }
.app { display: grid; grid-template-columns: minmax(360px, 440px) 1fr; height: 100dvh; }
.panel { overflow-y: auto; padding-block: 28px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.map-wrap { position: relative; min-width: 0; background: var(--soft); }
.map { position: absolute; inset: 0; }
.map-off { position: absolute; inset: auto 16px 16px; margin: 0; color: var(--muted); }

.eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 8px; font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -.03em; }
h2 { margin: 4px 0 14px; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
h3 { margin: 22px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.lede { margin: 0; color: var(--muted); max-width: 46ch; }

.picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { --c: var(--ink); font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  box-shadow: 0 1px 0 var(--line), 0 6px 14px -10px rgba(21, 23, 28, .25); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.card:hover { transform: translateY(-2px); }
.card:active { transform: scale(.97); }
.card[aria-selected="true"] { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 14px 24px -14px var(--c); transform: translateY(-3px); }
.card strong { font-size: 16px; font-weight: 600; }
.card .meta { font: 12px/1.3 var(--f-num); color: var(--muted); }
.card-top { display: flex; justify-content: space-between; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.lvl { display: flex; gap: 3px; }
.lvl i { width: 4px; height: 12px; border-radius: 2px; background: var(--line); }
.lvl i.on { background: var(--c); }

.dep { border: 0; padding: 0; margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dep legend { float: left; margin-right: 8px; font-size: 13px; color: var(--muted); }
.dep label { position: relative; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font: 13px var(--f-num); cursor: pointer; }
.dep label.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dep input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.dep label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }

.detail { --c: var(--ink); border-top: 1px solid var(--line); padding-top: 20px; }
.detail .eyebrow { color: var(--c); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--bg); padding: 10px; min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 2px 0 0; font: 500 14px/1.2 var(--f-num); font-variant-numeric: tabular-nums; }
.summary { margin: 14px 0 0; max-width: 62ch; }

.timeline { list-style: none; margin: 18px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--c); display: grid; gap: 8px; }
.timeline li { display: flex; gap: 12px; align-items: baseline; }
.timeline .t { font: 500 14px var(--f-num); font-variant-numeric: tabular-nums; min-width: 46px; }
.badge { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--soft); border-left: 3px solid var(--ok); }
.badge[data-s="tight"] { border-left-color: var(--warn); }
.badge[data-s="late"] { border-left-color: var(--late); }

.leg { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; }
.leg + .leg { margin-top: 8px; }
.leg summary { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; cursor: pointer; font-weight: 600; list-style: none; }
.leg summary::-webkit-details-marker { display: none; }
.leg summary::after { content: "+"; font: 400 18px var(--f-num); color: var(--muted); margin-left: 10px; }
.leg[open] summary::after { content: "–"; }
.leg .dur { margin-left: auto; font: 500 13px var(--f-num); color: var(--muted); }
.leg ul { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 8px; }
.leg li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; font-size: 14px; align-items: baseline; }
.leg .mode { font: 500 11px var(--f-num); text-transform: uppercase; color: var(--c); }
.leg .min { font: 12px var(--f-num); color: var(--muted); white-space: nowrap; }
.note { margin: 0; padding: 0 14px 12px; font-size: 13px; color: var(--muted); }

.checks, .rules ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.links a { color: var(--ink); text-decoration-color: var(--c); text-underline-offset: 3px; }
.gpx { margin-top: 14px; font: 600 14px var(--f-ui); color: var(--bg); background: var(--ink); border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; }
.gpx:active { transform: scale(.97); }
.fine { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.rules { border-top: 1px solid var(--line); color: var(--ink); font-size: 14px; }
.rules p { margin: 0; max-width: 62ch; }

.pin { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 4px solid var(--c); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.pin.home { width: 16px; height: 16px; border-radius: 4px; }

@media (max-width: 899px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52vh auto; height: auto; }
  .map-wrap { order: -1; }
  .panel { overflow: visible; border-right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
  h1 { font-size: 32px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="cover">
  <picture>
    <source media="(max-width: 700px)" srcset="cover-portrait.jpg">
    <img src="cover.jpg" width="1536" height="1024" alt="Tour à vélo, samedi après-midi : RER et vélo, trois boucles autour de Paris">
  </picture>
  <a class="go" href="#parcours">Voir les 3 parcours</a>
</header>
<main id="parcours"><app-root></app-root></main>

    <div class="picker" role="tablist" aria-label="Parcours">
      @for (r of rides; track r.id) {
        <button type="button" class="card" role="tab" [attr.aria-selected]="r.id === selectedId()" [style.--c]="r.color" (click)="select(r.id)">
          <span class="card-top"><span class="dot"></span>
            <span class="lvl" [attr.aria-label]="r.level">@for (n of [1, 2, 3]; track n) {<i [class.on]="n <= r.levelN"></i>}</span>
          </span>
          <strong>{{ r.short }}</strong>
          <span class="meta">{{ r.km }} km \xB7 {{ r.level }}</span>
        </button>
      }
    </div>

    <fieldset class="dep">
      <legend>On part \xE0</legend>
      @for (d of departures; track d) {
        <label [class.on]="d === departure()">
          <input type="radio" name="dep" [id]="'dep-' + d" [checked]="d === departure()" (change)="departure.set(d)">{{ clock(d) }}
        </label>
      }
    </fieldset>

    @let r = selected();
    @let p = plan();
    <section class="detail" [style.--c]="r.color">
      <p class="eyebrow">{{ r.place }}</p>
      <h2>{{ r.name }}</h2>
      <dl class="stats">
        <div><dt>Distance</dt><dd>{{ r.km }} km</dd></div>
        <div><dt>D\xE9nivel\xE9</dt><dd>{{ r.dplus }} m</dd></div>
        <div><dt>En selle</dt><dd>{{ r.rideLabel }}</dd></div>
        <div><dt>V\xE9lo</dt><dd>{{ r.bike }}</dd></div>
      </dl>
      <p class="summary">{{ r.summary }}</p>

      <ol class="timeline">
        <li><span class="t">{{ clock(departure()) }}</span><span>D\xE9part de Montmartre</span></li>
        <li><span class="t">{{ clock(p.start) }}</span><span>En selle \xE0 {{ r.startName }}</span></li>
        <li><span class="t">{{ clock(p.end) }}</span><span>Fin de la boucle</span></li>
        <li><span class="t">{{ clock(p.home) }}</span><span>Retour \xE0 la maison</span></li>
      </ol>
      <p class="badge" [attr.data-s]="p.status">{{ p.label }}</p>

      <details class="leg" open>
        <summary><span>Aller</span><span class="dur">{{ duration(p.outMin) }}</span></summary>
        <ul>
          @for (l of r.out; track $index) {
            <li><span class="mode">{{ l.mode }}</span><span class="txt">{{ l.detail }}</span><span class="min">{{ l.minutes }} min</span></li>
          }
        </ul>
      </details>
      <details class="leg">
        <summary><span>Retour</span><span class="dur">{{ duration(p.backMin) }}</span></summary>
        <ul>
          @for (l of r.back; track $index) {
            <li><span class="mode">{{ l.mode }}</span><span class="txt">{{ l.detail }}</span><span class="min">{{ l.minutes }} min</span></li>
          }
        </ul>
        @if (r.backNote) { <p class="note">{{ r.backNote }}</p> }
      </details>

      <h3>V\xE9los autoris\xE9s</h3>
      <ul class="checks">
        @for (a of r.allowed; track $index) { <li>{{ a }}</li> }
      </ul>

      <h3>Traces GPX de r\xE9f\xE9rence</h3>
      <ul class="links">
        @for (s of r.sources; track s.url) { <li><a [href]="s.url" target="_blank" rel="noopener">{{ s.label }}</a></li> }
      </ul>
      <button type="button" class="gpx" (click)="downloadGpx()">T\xE9l\xE9charger ce trac\xE9 en .gpx</button>
      <p class="fine">{{ snapped()[r.id] ? 'Trac\xE9 recalcul\xE9 sur les voies cyclables OpenStreetMap \xE0 partir des points de passage de l\u2019itin\xE9raire de r\xE9f\xE9rence.' : 'Trac\xE9 indicatif par points de passage. Le GPX de r\xE9f\xE9rence est dans les liens.' }}</p>
    </section>

    <section class="rules">
      <h3>Train + v\xE9lo ce week-end</h3>
      <ul>
        <li>RER et Transilien : v\xE9los accept\xE9s toute la journ\xE9e le week-end, sauf si la rame est bond\xE9e (150 \u20AC d\u2019amende).</li>
        <li>En semaine, interdits de 6h30 \xE0 9h30 et de 16h30 \xE0 19h30.</li>
        <li>Pas de v\xE9lo dans le m\xE9tro : on roule jusqu\u2019\xE0 la gare.</li>
        <li>Pont de la Toussaint : regardez les travaux du jour dans l\u2019appli \xCEle-de-France Mobilit\xE9s ou SNCF Connect.</li>
      </ul>
      <h3>Pour suivre la trace</h3>
      <p><strong>Komoot</strong> sur le t\xE9l\xE9phone : on importe le GPX, guidage vocal, et on partage le tour au groupe. Pour montrer les traces sur un \xE9cran, <strong>gpx.studio</strong> marche directement dans le navigateur, gratuitement.</p>
    </section>
  </aside>

  <div class="map-wrap">
    <div #map class="map"></div>
    @if (mapState() === 'offline') { <p class="map-off">La carte ne se charge pas dans cet aper\xE7u. Ouvre la page dans Chrome ou Safari, avec internet.</p> }
  </div>
</div>`})],Mm);xk(Mm).catch(t=>console.error(t));})();
</script>
</body>
</html>
